; PlatformIO project config - BMW E90 round OBD display
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform  = espressif32
board     = esp32dev            ; generic ESP32-WROOM-32 (ELEGOO dev board)
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Libraries are fetched automatically on first build - nothing to install by hand,
; nothing to commit. Versions are resolved and pinned in the lock behind the scenes.
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit GC9A01A
    powerbroker2/ELMduino
